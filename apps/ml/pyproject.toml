[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantiv-ml"
version = "0.1.0"
description = "Signed LightGBM model loading and shared Quantiv ML primitives."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quantiv" }]
dependencies = [
    "cryptography>=43.0.0",
    "duckdb>=1.0.0",
    # Production artifacts use LightGBM's non-executable native text format.
    "lightgbm>=4.0.0",
    "numpy>=1.24.0,<2",
    "pandas>=2.0.0,<3",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
# Scheduled feature engineering, training, and model-selection paths.
train = [
    "optuna>=3.3.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]
# Human-run research tooling. Keep visualization/notebook dependencies out of
# production serving images unless a research environment explicitly requests it.
research = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff==0.14.4",
]

# We only ship the `ml` package (the serving code). Training scripts in
# apps/ml/*.py are intentionally not part of the wheel — they're invoked
# directly by CI, not imported by the API service.
[tool.setuptools.packages.find]
where = ["."]
include = ["ml*"]
exclude = ["data*", "models*"]

[tool.setuptools.package-data]
ml = ["*.pem"]
