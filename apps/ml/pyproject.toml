[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantiv-ml"
version = "0.1.0"
description = "ML serving package consumed by apps/backend."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quantiv" }]
dependencies = [
    "duckdb>=1.0.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0,<2",
    "pandas>=2.0.0,<3",
    "pyarrow>=15.0.0",
]

# We only ship the `ml` package (the serving code). Training scripts in
# apps/ml/*.py are intentionally not part of the wheel — they're invoked
# directly by the CI workflow, not imported.
[tool.setuptools.packages.find]
where = ["."]
include = ["ml*"]
exclude = ["data*", "models*"]
