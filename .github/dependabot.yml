# Scheduled dependency upgrades are applied directly to main in tested batches.
# Keep the ecosystem definitions for dependency metadata, but do not open version
# update PRs. GitHub security alerts and repository-level security updates remain
# separate from this scheduled version-update limit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /workers/refresh-prices
    schedule:
      interval: weekly
    groups:
      worker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      data-pipeline:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 0
