version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /workers/refresh-prices
    schedule:
      interval: weekly
    groups:
      worker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      data-pipeline:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
