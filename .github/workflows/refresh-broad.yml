name: Broad quote refresh (Polygon grouped-daily)

# Keeps the whole calendar universe's quote:{SYM} cache warm while the market is
# CLOSED, in one Polygon grouped-daily call (vs Finnhub's 30+ min single-symbol
# cursor). The /api/cron/refresh-broad route self-gates: it no-ops during the
# live quote-refresh window so it never clobbers fresh Finnhub/Alpaca ticks, so
# these schedules can fire around the clock and only do work off-hours.
#
# Scheduled runs intentionally avoid minute :00. GitHub Actions documents that
# scheduled workflows are most likely to be delayed or dropped at the start of
# an hour, which is exactly when this job used to run. Multiple overnight passes
# span both EDT and EST so Polygon's completed daily bar has several chances to
# land before the next morning. The final 08:17 UTC run is also a watchdog: if
# grouped-daily is still stale then, the workflow fails visibly instead of
# silently leaving yesterday's AMC realized moves blank.
#
# Requires the BROAD_REFRESH_SECRET repo secret (a dedicated token, also set in
# the Vercel project env). POLYGON_API_KEY is already configured in Vercel.
on:
  schedule:
    # Early evening warmups: 18:17/19:17 ET in EDT, 17:17/18:17 ET in EST.
    - cron: '17 22,23 * * 1-5'
    # Overnight retries: 22:17-02:17 ET in EDT, 21:17-01:17 ET in EST.
    - cron: '17 2,4,6 * * 2-6'
    # Final watchdog: 04:17 ET in EDT, 03:17 ET in EST.
    - cron: '17 8 * * 2-6'
    # Sunday fallback so Friday's close is warm before Monday.
    - cron: '17 23 * * 0'
  workflow_dispatch: {}

concurrency:
  group: refresh-broad
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger broad quote refresh
        env:
          BROAD_REFRESH_SECRET: ${{ secrets.BROAD_REFRESH_SECRET }}
          # Override via the REFRESH_BROAD_URL repo variable if the domain changes.
          REFRESH_BROAD_URL: ${{ vars.REFRESH_BROAD_URL || 'https://usequantiv.com/api/cron/refresh-broad' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$BROAD_REFRESH_SECRET" ]; then
            echo "::error::BROAD_REFRESH_SECRET secret is not set"; exit 1
          fi

          code=$(curl -sS -o /tmp/broad.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $BROAD_REFRESH_SECRET" "$REFRESH_BROAD_URL")
          echo "HTTP $code"; cat /tmp/broad.json; echo
          [ "$code" = "200" ]

          # The final scheduled retry is a freshness watchdog. By 08:17 UTC the
          # most recently completed US session should be available even across
          # DST changes. If not, surface the stale provider state as a failed
          # workflow so it cannot silently leave prior-day AMC moves unresolved.
          if [ "$SCHEDULE" = "17 8 * * 2-6" ]; then
            python - <<'PY'
          import json
          import sys

          with open('/tmp/broad.json', encoding='utf-8') as fh:
              payload = json.load(fh)

          if payload.get('groupedIsCurrent') is not True:
              latest = payload.get('latestSession')
              prior = payload.get('priorSession')
              skipped = payload.get('skipped')
              print(
                  '::error::Final overnight broad refresh still has stale grouped-daily '
                  f'data (latestSession={latest}, priorSession={prior}, skipped={skipped})'
              )
              sys.exit(1)
          PY
          fi
