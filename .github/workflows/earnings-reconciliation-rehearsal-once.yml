name: Earnings reconciliation published-release rehearsal one-shot
# rehearsal trigger: candidate-universe bound verification

on:
  push:
    branches:
      - fix/earnings-calendar-reconciliation
    paths:
      - .github/workflows/earnings-reconciliation-rehearsal-once.yml

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Install verified rclone
        run: bash scripts/install_rclone.sh

      - name: Configure R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Materialize production release
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REQUIRE_RUNTIME_STATE: "1"
        run: bash scripts/r2_pull.sh

      - name: Rehearse reconciliation on published calendar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python scripts/reconcile_earnings_calendar.py \
            --days-ahead 60 \
            --announcement-days-ahead 35 \
            --alpha-news-max 20 \
            --report /tmp/earnings_calendar_reconciliation.json

      - name: Apply verified bootstrap overrides
        run: python scripts/apply_earnings_overrides.py --allow-missing

      - name: Verify reconciled calendar integrity
        run: python scripts/check_earnings_calendar_integrity.py --require-baseline

      - name: Print near-term decisions
        if: always()
        run: |
          if [ -f /tmp/earnings_calendar_reconciliation.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/earnings_calendar_reconciliation.json").read_text())
          watch = {"AIR","FERG","BXMT","CCL","CAG","FDS","JEF","PRGS","ACN","MKC","NKE","APOG"}
          print("reason_counts:")
          counts = {}
          for d in report.get("decisions", {}).values():
              reason = d.get("reason")
              counts[reason] = counts.get(reason, 0) + 1
          print(json.dumps(counts, sort_keys=True))
          print("watch_decisions:")
          print(json.dumps(
              {k:v for k,v in report.get("decisions", {}).items() if k in watch},
              indent=2, sort_keys=True
          ))
          print("nontrivial_count:", len(report.get("nontrivial_decisions", {})))
          PY
          python - <<'PY'
          import csv, json
          from pathlib import Path
          watch = {"AIR","FERG","BXMT","CCL","CAG","FDS","JEF","PRGS","ACN","MKC","NKE","APOG"}
          rows = []
          with Path("data/earnings_calendar.csv").open() as fh:
              for row in csv.DictReader(fh):
                  if row.get("act_symbol") in watch and "2026-09-19" <= row.get("date","") <= "2026-11-15":
                      rows.append({
                          "ticker": row.get("act_symbol"),
                          "date": row.get("date"),
                          "timing": row.get("timing"),
                          "source": row.get("source"),
                      })
          print("final_watch_rows:")
          print(json.dumps(sorted(rows, key=lambda r:(r["date"],r["ticker"])), indent=2))
          PY
          fi

      - name: Upload sanitized rehearsal report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: earnings-reconciliation-rehearsal
          path: /tmp/earnings_calendar_reconciliation.json
          if-no-files-found: warn
          retention-days: 14
