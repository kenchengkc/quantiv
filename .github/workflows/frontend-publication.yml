name: Frontend publication release

on:
  workflow_run:
    workflows:
      - "Daily data refresh"
      - "Refresh ticker names"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: frontend-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout published main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      # workflow_run.head_sha is the revision that started the producer workflow,
      # not necessarily the generated-data commit that producer may push afterward.
      # Provenance must describe the bytes actually checked out and packaged here.
      - name: Capture release provenance
        run: echo "FRONTEND_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install verified rclone
        run: bash scripts/install_rclone.sh

      - name: Configure R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Build, verify, publish, and pin immutable frontend release
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'quantiv-data' }}
        run: bash scripts/r2_push_frontend.sh

      - name: Commit only the deployment pointer
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "Quantiv publication bot"
          git add apps/frontend/frontend-release.json
          if git diff --staged --quiet; then
            echo "Frontend deployment pointer already matches the published release."
          else
            RELEASE_ID=$(jq -r .release_id apps/frontend/frontend-release.json)
            git commit -m "publish frontend release ${RELEASE_ID:0:12}"
            bash scripts/git_push_with_retry.sh origin main
          fi

      - name: Preserve publication control artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-publication-control
          path: |
            apps/frontend/frontend-release.json
            data/frontend_publication/current.json
            data/frontend_publication/manifests/*.json
          if-no-files-found: ignore
          retention-days: 30
