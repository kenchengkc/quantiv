name: P0 static publication import codemod

on:
  push:
    branches: ["cleanup/p0-publication-static-analysis"]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: cleanup/p0-publication-static-analysis

      - name: Replace validation JSON modules with server publication reads
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/frontend/app/(public)/validation/page.tsx')
          text = path.read_text()
          old_imports = """import { publishedForecastStatus, quoteEligibilityExplanation } from '@/lib/publicationPresentation';
          import controlPlaneJson from '../../../public/control-plane.json';
          import forecastEvidenceJson from '../../../public/evidence/forecast.json';
          import modelValidationJson from '../../../public/evidence/model-validation.json';
          """
          new_imports = """import { publishedForecastStatus, quoteEligibilityExplanation } from '@/lib/publicationPresentation';
          import { readPublicJson } from '@/lib/researchSnapshot.server';
          """
          old_values = """const validation = modelValidationJson as unknown as ValidationArtifact;
          const control = controlPlaneJson as unknown as ControlPlane;
          const forecast = forecastEvidenceJson as unknown as ForecastEvidence;
          """
          new_values = """const validation = readPublicJson<ValidationArtifact>('evidence', 'model-validation.json');
          const control = readPublicJson<ControlPlane>('control-plane.json');
          const forecast = readPublicJson<ForecastEvidence>('evidence', 'forecast.json');
          if (!validation || !control || !forecast) {
            throw new Error('Validation publication is unavailable; frontend release materialization is incomplete.');
          }
          """
          if old_imports not in text:
              raise SystemExit('validation import block did not match expected source')
          if old_values not in text:
              raise SystemExit('validation value block did not match expected source')
          text = text.replace(old_imports, new_imports, 1).replace(old_values, new_values, 1)
          path.write_text(text)
          PY

      - name: Commit codemod result
        run: |
          set -euo pipefail
          git config user.name 'quantiv-bot'
          git config user.email 'quantiv-bot@users.noreply.github.com'
          git add 'apps/frontend/app/(public)/validation/page.tsx'
          git diff --staged --check
          git commit -m 'P0: read validation evidence through publication boundary'
          git push origin HEAD:cleanup/p0-publication-static-analysis
