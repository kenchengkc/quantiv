name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, type-check, build, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --workspace=apps/frontend
      - run: npm run type-check --workspace=apps/frontend
      - run: npm run build --workspace=apps/frontend
        env:
          # Clerk's publishable key is baked into the client bundle during
          # prerender, so it must be present at build time. Secret + DB URL
          # aren't strictly needed for prerender but we pass them through so
          # route handlers type-check identically to production.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Vitest covers route, data-contract, and UI utility regressions.
      - run: npm run test --workspace=apps/frontend -- --run

  e2e:
    name: Frontend (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend

      - run: npm run test:e2e --workspace=apps/frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          # E2E_USER_* are the credentials the Playwright globalSetup uses
          # to mint a Clerk session. Set only if you actually run the
          # signed-in specs (watchlist) in CI; public specs work without.
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}

      # Run the FCP budget against a production build. The regular browser
      # suite deliberately uses next dev, whose compilation work is not a
      # meaningful performance signal.
      - run: npm run build --workspace=apps/frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      - run: npm run test:performance --workspace=apps/frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r apps/backend/requirements.txt
      # The current prediction service consumes the published ml package.
      # Install it editable so the package layout is honored.
      - run: pip install -e apps/ml
      - run: pip install ruff==0.14.4 pytest

      # Lint the published `ml/` package and the backend. The legacy
      # training entrypoints under apps/ml/*.py are out of scope — they
      # pre-date this lint gate and are run by hand / by CI scripts, not
      # imported as a library.
      - run: ruff check apps/backend apps/ml/ml apps/ml/tests
      - run: pytest apps/backend/tests apps/ml/tests -q
        env:
          # Tests do not open the lifespan connections, but the environment
          # still documents the only supported live-serving database.
          DATABASE_URL: postgres://ci@localhost:5432/ci

  data-contracts:
    name: Data pipeline (ruff, pytest, artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
      - run: pip install -e apps/ml
      - run: pip install ruff==0.14.4 pytest

      # Deterministic, provider-mocked tests for ingestion budgets, ticker
      # lifecycle, generated public JSON, model activation receipts, and the
      # frontend-data transformations consumed by deployment jobs.
      - run: ruff check scripts tools
      - run: pytest scripts tools -q
        env:
          PYTHONPATH: apps/ml:scripts:tools

  quote-worker:
    name: Quote Worker (type-check, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/refresh-prices/package-lock.json

      - run: npm ci --prefix workers/refresh-prices
      - run: npm run type-check --prefix workers/refresh-prices
      - run: npm test --prefix workers/refresh-prices

  railway-image:
    name: Railway image (build, health smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f apps/backend/Dockerfile -t quantiv-backend:ci .

      - name: Start image and verify health
        run: |
          set -euo pipefail
          docker run -d --name quantiv-backend-ci --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e ADMIN_API_KEY=ci-admin \
            quantiv-backend:ci
          trap 'docker logs quantiv-backend-ci; docker rm -f quantiv-backend-ci >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:8000/health); then
              echo "$response"
              echo "$response" | grep -q '"status":"healthy"'
              exit 0
            fi
            sleep 1
          done
          echo "Backend health endpoint did not become healthy" >&2
          exit 1
