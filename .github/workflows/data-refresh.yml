name: Daily data refresh

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      finnhub_profile_refresh:
        description: "Profile/logo maintenance mode."
        type: choice
        options: [auto, missing-only, full, skip]
        default: auto
      run_sunday_finnhub_sweep:
        description: "Also run the bounded full-universe earnings sweep on a manual Sunday refresh."
        type: boolean
        default: false

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
    env:
      FINNHUB_RESERVED_WINDOW_SOFT_SKIP: '1'
    steps:
      - name: Record refresh start time
        run: echo "REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install verified rclone
        run: bash scripts/install_rclone.sh

      - name: Configure R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Materialize prior production release from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_pull.sh

      - name: Sync latest options chain from DoltHub
        id: options_sync
        continue-on-error: true
        run: python scripts/sync_dolthub.py

      - name: Sync earnings calendar
        run: python scripts/sync_dolthub.py --earnings

      - name: Overlay near-term earnings from Finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set +e
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python scripts/sync_finnhub_earnings.py --allow-missing-key --delay 1.05 --max-calls 5 $EXTRA_ARGS
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              exit "$status"
            fi
            echo "::warning::Finnhub earnings overlay failed with exit $status; continuing scheduled refresh."
          fi

      - name: Overlay EPS and revenue from FMP
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/sync_fmp_earnings.py --allow-missing-key --allow-quota-exhausted --no-date-params

      - name: Backfill FMP EPS and revenue history by symbol
        if: ${{ vars.ENABLE_FMP_SYMBOL_BACKFILL == '1' }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python scripts/backfill_fmp_earnings_by_symbol.py \
            --allow-missing-key \
            --max-calls 240 \
            --delay 0.25 \
            --refresh-after-days 90

      - name: Refresh cached US market holidays
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          EXTRA_ARGS="--skip-during-market-hours"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python scripts/sync_finnhub_market_holidays.py --allow-missing-key $EXTRA_ARGS

      - name: Sunday full-universe Finnhub sweep
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.run_sunday_finnhub_sweep }}" != "true" ]; then
            echo "Manual refresh did not opt into the Sunday Finnhub sweep; skipping."
            exit 0
          fi
          DOW=$(date -u +%u)
          if [ "$DOW" != "7" ]; then
            echo "Not Sunday (UTC weekday=$DOW); skipping full-universe Finnhub sweep."
            exit 0
          fi
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python scripts/sync_finnhub_earnings.py \
            --frontend-universe \
            --past-days 30 \
            --future-days 0 \
            --delay 1.05 \
            --max-calls 2000 \
            --allow-missing-key \
            $EXTRA_ARGS

      - name: Apply manual earnings overrides
        run: python scripts/apply_earnings_overrides.py --allow-missing

      - name: Detect delistings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/detect_delistings.py --allow-fetch-failure --notify-github

      - name: Apply ticker lifecycle to earnings artifacts
        run: python scripts/apply_ticker_lifecycle.py

      - name: Gate — earnings calendar integrity against prior release
        run: python scripts/check_earnings_calendar_integrity.py --require-baseline

      - name: Sync OHLCV
        run: python scripts/sync_dolthub.py --ohlcv

      - name: Sync split and dividend controls
        run: python scripts/sync_dolthub.py --corporate-actions

      - name: Sync volatility history
        run: python scripts/sync_dolthub.py --volhist

      - name: Sync VIX
        continue-on-error: true
        run: python scripts/sync_vix.py

      - name: Rebuild DuckDB views
        run: python scripts/setup_duckdb_from_parquet.py

      - name: Gate — verify candidate data freshness before scoring
        id: candidate_freshness
        continue-on-error: true
        run: python scripts/check_duckdb_freshness.py --strict --max-lag-days 5

      - name: Build candidate reconciliation control manifest
        id: candidate_reconciliation
        continue-on-error: true
        run: |
          python scripts/build_data_reconciliation.py \
            --strict \
            --max-lag-days 5 \
            --days-ahead 21 \
            --report data/validation/data_reconciliation.json

      - name: Upload data reconciliation manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-reconciliation
          path: data/validation/data_reconciliation.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Finalize options snapshot decision
        id: options_gate
        run: |
          python scripts/options_snapshot_resilience.py \
            --manifest data/validation/data_reconciliation.json \
            --data-dir data \
            --sync-outcome "${{ steps.options_sync.outcome }}" \
            --not-before "$REFRESH_STARTED_AT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore validated fallback after rejected options candidate
        if: steps.options_gate.outputs.can_score != 'true'
        run: |
          python scripts/setup_duckdb_from_parquet.py
          python scripts/sync_dolthub.py --corporate-actions
          python scripts/setup_duckdb_from_parquet.py
          python scripts/build_data_reconciliation.py \
            --max-lag-days 5 \
            --days-ahead 21 \
            --report data/validation/data_reconciliation.json
          python scripts/options_snapshot_resilience.py \
            --verify-fallback \
            --manifest data/validation/data_reconciliation.json \
            --data-dir data \
            --not-before "$REFRESH_STARTED_AT"

      - name: Upload options snapshot decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: options-snapshot-decision
          path: |
            data/validation/options_snapshot_status.json
            data/quarantine/options_candidates
          if-no-files-found: ignore
          retention-days: 30

      - name: Promote reconciled parquet and controls to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh --skip-forecasts

      - name: Score upcoming earnings
        if: steps.options_gate.outputs.can_score == 'true'
        run: python scripts/daily_score.py --days-ahead 21

      - name: Gate — validate scored ML and IV forecasts
        if: steps.options_gate.outputs.can_score == 'true'
        run: |
          python scripts/validate_ml_pipeline.py forecasts \
            --report data/validation/daily_forecasts.json \
            --publish-receipt-dir data/forecasts/receipts

      - name: Upload daily forecast validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-forecast-validation
          path: data/validation/daily_forecasts.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Monitor champion, shadows, and feature drift
        if: steps.options_gate.outputs.can_score == 'true'
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          if [ -f data/models/control/champion.json ]; then
            python scripts/model_control_plane.py monitor
          else
            echo "No signed champion yet; monitoring begins after the first gated retrain."
          fi

      - name: Import recent forecasts to Neon
        if: steps.options_gate.outputs.can_score == 'true'
        id: neon_import
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u scripts/import_recent_to_postgres.py --full

      - name: Push forecasts to R2
        if: steps.options_gate.outputs.can_score == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh --forecasts-only

      - name: Pull market caps
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python -u tools/pull_market_caps.py --allow-missing-key $EXTRA_ARGS

      - name: Build popular-ticker weights
        run: python -u tools/build_popular_weights.py

      - name: Build frontend JSON
        if: steps.options_gate.outputs.can_score == 'true'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_REALIZED_FALLBACK: "1"
          TWELVEDATA_DAILY_CREDIT_LIMIT: "792"
          TWELVEDATA_BATCH_SIZE: "8"
          TWELVEDATA_BATCH_DELAY_SEC: "61"
          TWELVEDATA_VALIDATION_SAMPLE_SIZE: "8"
          TWELVEDATA_VALIDATION_DELTA_PCT: "0.005"
          TWELVEDATA_SHARE_PROVIDER_LEDGER: "1"
        run: python -u tools/build_frontend_data.py

      - name: Build production control snapshot
        env:
          CONTROL_DATA_R2_STATUS: passed
          CONTROL_FORECAST_R2_STATUS: ${{ steps.options_gate.outputs.can_score == 'true' && 'passed' || 'degraded' }}
          CONTROL_FRONTEND_PAYLOAD_STATUS: ${{ steps.options_gate.outputs.can_score == 'true' && 'passed' || 'degraded' }}
          CONTROL_NEON_IMPORT_STATUS: ${{ steps.options_gate.outputs.can_score == 'true' && steps.neon_import.outcome || 'degraded' }}
        run: python -u tools/build_control_plane_snapshot.py

      - name: Refresh ticker names for newly priced symbols
        run: |
          python3 -c "
          import duckdb, glob, sys
          files = sorted(glob.glob('data/parquet/options_chain/**/*.parquet', recursive=True))
          if not files:
              sys.exit(0)
          rows = duckdb.connect().execute(
              'SELECT DISTINCT act_symbol FROM read_parquet(?)', [files]
          ).fetchall()
          print('\\n'.join(r[0] for r in rows if r[0]))
          " | sort -u > /tmp/dolt_tickers.txt
          jq -r 'keys[]' apps/frontend/public/ticker-names.json | sort -u > /tmp/known_names.txt
          NEW=$(comm -23 /tmp/dolt_tickers.txt /tmp/known_names.txt)
          if [ -n "$NEW" ]; then
            echo "$NEW" | head -20
            node scripts/build_ticker_names.mjs
          else
            echo "No forecast-eligible tickers missing display names."
          fi

      - name: Commit generated publication and controlled metadata
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "Quantiv bot"
          git add apps/frontend/public apps/frontend/lib/popular.ts
          git add config/delisted_tickers.json config/ticker_renames.json
          # Transitional state still required by existing generators. The
          # canonical earnings calendar is deliberately absent: R2 owns it.
          for f in data/market_caps.json data/popular_snapshot.json data/popular_changes.jsonl data/fmp_earnings_metadata.json data/fmp_earnings_backfill_state.json data/delisting_watch.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "No generated source-controlled publication changes"
          else
            git commit -m "daily refresh $(date -u +%Y-%m-%d)"
            bash scripts/git_push_with_retry.sh origin main
          fi

  finnhub-profile-sweep:
    runs-on: ubuntu-latest
    needs: refresh
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pull latest main after refresh commit
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Finnhub profile/logo sweep
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PROFILE_REFRESH: ${{ inputs.finnhub_profile_refresh || 'auto' }}
        run: |
          set -euo pipefail
          MODE="$PROFILE_REFRESH"
          ARGS=()
          case "$MODE" in
            auto)
              DOW=$(date -u +%u)
              if [ "$DOW" != "6" ]; then
                echo "Profile sweep auto mode only runs Saturday UTC; skipping."
                exit 0
              fi
              ARGS=(--missing-only --force)
              ;;
            missing-only) ARGS=(--missing-only --force) ;;
            full) ARGS=(--full --force) ;;
            skip) echo "Profile sweep skipped."; exit 0 ;;
            *) echo "Unknown profile refresh mode: $MODE" >&2; exit 2 ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS+=(--allow-market-hours)
          fi
          python -u scripts/sync_finnhub_profiles.py \
            --allow-missing-key \
            --universe frontend \
            "${ARGS[@]}"
          python scripts/check_ticker_identity.py --warn-only

      - name: Commit profile/logo cache
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Quantiv bot"
          git add apps/frontend/public/ticker-logos.json
          if git diff --staged --quiet; then
            echo "No profile/logo cache changes"
          else
            git commit -m "refresh Finnhub profile logos $(date -u +%Y-%m-%d)"
            bash scripts/git_push_with_retry.sh origin main
          fi
