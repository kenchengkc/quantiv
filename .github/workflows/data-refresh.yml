name: Historical publication token diagnostic
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Authenticate historical production proof without publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=scripts python3 -u - <<'PY'
          import os, re, subprocess
          from historical_forecast_publication import authenticate_smoke_publication
          try:
              proof = authenticate_smoke_publication('40231566942')
              print('Historical proof authenticated:', {key: proof[key] for key in ('run_id', 'job_id', 'checkout_revision', 'release_id')})
          except subprocess.CalledProcessError as error:
              message = (error.stderr or b'').decode('utf-8', errors='replace')
              for name in ('GH_TOKEN', 'GITHUB_TOKEN'):
                  if os.getenv(name):
                      message = message.replace(os.environ[name], '[REDACTED]')
              message = re.sub(r'https?://\S+', '[URL REDACTED]', message)
              message = re.sub(r'(?i)(authorization|token|password)\s*[:=]\s*\S+', r'\1=[REDACTED]', message)
              print('Historical proof command failed:', error.returncode, message[:3000])
              raise SystemExit(1)
          PY
