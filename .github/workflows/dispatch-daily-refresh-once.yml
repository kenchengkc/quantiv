name: Dispatch daily refresh once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-daily-refresh-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Daily data refresh on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/actions/workflows/daily-refresh.yml/dispatches" \
            -d '{"ref":"main","inputs":{"run_refresh":"true","warn_only_integrity":"false","finnhub_profile_refresh":"auto","run_sunday_finnhub_sweep":"false","run_retrain":"false"}}'
