name: Earnings provider benchmark one-shot

on:
  push:
    branches:
      - benchmark/earnings-provider-bakeoff
    paths:
      - .github/workflows/earnings-provider-benchmark-once.yml
      - scripts/benchmark_earnings_providers.py

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        run: pip install requests==2.34.2 pytest==9.1.1

      - name: Verify benchmark tests
        run: pytest scripts/tests/test_benchmark_earnings_providers.py -q

      - name: Call configured earnings APIs
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_API_KEY_2: ${{ secrets.FMP_API_KEY_2 }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_API_KEY_2: ${{ secrets.TWELVEDATA_API_KEY_2 }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPHAVANTAGE_API_KEY_2: ${{ secrets.ALPHAVANTAGE_API_KEY_2 }}
          ALPHAVANTAGE_API_KEY_3: ${{ secrets.ALPHAVANTAGE_API_KEY_3 }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_API_KEY_2: ${{ secrets.POLYGON_API_KEY_2 }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python scripts/benchmark_earnings_providers.py \
            --start 2026-09-21 \
            --end 2026-10-06 \
            --output-dir /tmp/earnings-provider-benchmark
          cat /tmp/earnings-provider-benchmark/summary.md

      - name: Upload sanitized benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: earnings-provider-benchmark-live
          path: /tmp/earnings-provider-benchmark
          if-no-files-found: warn
          retention-days: 14
