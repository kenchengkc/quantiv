name: Production smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "apps/backend/**"
      - "apps/frontend/**"
      - "apps/ml/**"
      - "lib/**"
      - "railway.toml"
      - "scripts/production_smoke.mjs"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Public frontend and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node scripts/production_smoke.mjs
        env:
          PRODUCTION_FRONTEND_URL: https://usequantiv.com
          PRODUCTION_BACKEND_URL: https://api.usequantiv.com
