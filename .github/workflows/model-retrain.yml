name: Weekly model retrain

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-model-retrain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Install verified rclone
        run: bash scripts/install_rclone.sh

      - name: Configure R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Pull verified production data from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PULL_EARNINGS: "1"
          R2_HISTORICAL_TRAINING: "1"
        run: bash scripts/r2_pull.sh

      - name: Rebuild DuckDB views
        run: python scripts/setup_duckdb_from_parquet.py

      - name: Verify historical source integrity
        run: |
          python scripts/verify_historical_training_gate.py \
            --report data/validation/historical_training_admission.json

      - name: Build ML training parquet
        run: |
          END=$(date -u +%Y-%m-%d)
          python apps/ml/feature_engineering.py \
            --start-date 2023-01-01 \
            --end-date "$END"

      - name: Evaluate current data eligibility for activation
        id: activation-data
        run: |
          python scripts/verify_retrain_data_gate.py \
            --report data/validation/retrain_activation.json --allow-hold
          echo "status=$(jq -r .status data/validation/retrain_activation.json)" >> "$GITHUB_OUTPUT"

      - name: Evaluate realized champion outcomes and automatic rollback
        id: outcome-control
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          if [ -f data/models/control/champion.json ]; then
            python scripts/model_control_plane.py evaluate-outcomes \
              --activation-gate-report data/validation/retrain_activation.json \
              --activation-report data/validation/rollback_decision.json \
              --stage-rollback \
              --report data/validation/model_outcomes.json
            echo "rollback_staged=$(jq -r '.rollback_staged // false' data/validation/model_outcomes.json)" >> "$GITHUB_OUTPUT"
          else
            echo "rollback_staged=false" >> "$GITHUB_OUTPUT"
            echo "No signed champion exists; skipping realized-outcome evaluation."
          fi

      - name: Upload realized model outcome report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-realized-outcomes
          path: data/validation/model_outcomes.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Rescore automatic rollback independently of training
        id: rollback-score
        if: steps.outcome-control.outputs.rollback_staged == 'true'
        run: |
          ROLLBACK_BUNDLE_ID=$(jq -er .champion_bundle_id data/validation/rollback_decision.json)
          python scripts/daily_score.py \
            --days-ahead 21 \
            --models-dir "data/models/bundles/$ROLLBACK_BUNDLE_ID" \
            --output-path data/validation/rollback_forecasts.parquet

      - name: Apply automatic rollback only after exact forecast validation
        id: rollback-apply
        if: steps.outcome-control.outputs.rollback_staged == 'true'
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          python scripts/model_control_plane.py apply-rollback \
            --rollback-decision data/validation/rollback_decision.json \
            --candidate-forecast data/validation/rollback_forecasts.parquet \
            --activation-gate-report data/validation/retrain_activation.json \
            --report data/validation/rollback_applied.json
          echo "rolled_back=$(jq -r .rolled_back data/validation/rollback_applied.json)" >> "$GITHUB_OUTPUT"

      - name: Publish validated automatic rollback before training
        id: rollback-publication
        if: steps.rollback-apply.outputs.rolled_back == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python scripts/verify_retrain_data_gate.py --report data/validation/rollback_activation.json
          ROLLBACK_BUNDLE_ID=$(jq -er .champion_bundle_id data/validation/rollback_applied.json)
          FORECAST_PATH=$(jq -er .production_forecast data/validation/rollback_applied.json)
          python scripts/validate_ml_pipeline.py forecasts \
            --forecast-path "$FORECAST_PATH" \
            --models-dir "data/models/bundles/$ROLLBACK_BUNDLE_ID" \
            --report data/validation/rollback_production_forecasts.json \
            --publish-receipt-dir data/forecasts/receipts
          python scripts/verify_retrain_data_gate.py --report data/validation/rollback_activation.json
          bash scripts/r2_push.sh --model-recovery

      - name: Activate exact automatic rollback bundle
        id: rollback-serving
        if: steps.rollback-apply.outputs.rolled_back == 'true'
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          python scripts/activate_model_bundle.py \
            --decision data/validation/rollback_applied.json \
            --receipt data/validation/rollback_serving_activation.json

      - name: Import exact automatic rollback forecast
        id: rollback-import
        if: steps.rollback-apply.outputs.rolled_back == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          EXPECTED_BUNDLE_ID=$(jq -er .champion_bundle_id data/validation/rollback_applied.json)
          FORECAST_PATH=$(jq -er .production_forecast data/validation/rollback_applied.json)
          python -u scripts/import_recent_to_postgres.py \
            --file "$FORECAST_PATH" --full --require-database \
            --expected-model-bundle-id "$EXPECTED_BUNDLE_ID" \
            --activation-receipt data/validation/rollback_serving_activation.json \
            --receipt data/validation/rollback_forecast_import.json

      - name: Upload independent rollback handoff evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automatic-rollback-handoff
          path: data/validation/rollback_*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Persist realized outcome evidence before training
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh --candidate-control-only

      - name: Gate — validate full training source
        run: |
          python scripts/validate_ml_pipeline.py training \
            --report data/validation/retrain_training.json

      - name: Upload full training validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrain-training-validation
          path: data/validation/retrain_training.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Select recipes and refit LightGBM models on all mature history
        id: fit-models
        run: python apps/ml/model_trainer.py --tune --time-decay 0.5

      - name: Retain fitted research artifacts independently of promotion
        if: always() && steps.fit-models.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fitted-research-models
          path: |
            data/models/lgbm_T*.txt
            data/models/metadata_T*.json
            data/ml_training/**
            data/validation/historical_training_admission.json
          if-no-files-found: error
          retention-days: 30

      - name: Gate — mandatory purged walk-forward validation
        run: |
          python scripts/validate_walk_forward.py \
            --report data/validation/retrain_walk_forward.json

      - name: Upload walk-forward validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrain-walk-forward-validation
          path: data/validation/retrain_walk_forward.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Gate — validate trained model bundle
        run: |
          python scripts/validate_ml_pipeline.py models \
            --report data/validation/retrain_models.json \
            --publish-receipt-dir data/models/receipts

      - name: Upload model validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrain-model-validation
          path: data/validation/retrain_models.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Package signed challenger bundle
        id: package-challenger
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          python scripts/package_model_bundle.py \
            --source-revision "$GITHUB_SHA" \
            --output-manifest data/validation/candidate_bundle.json
          BUNDLE_ID=$(jq -r .bundle_id data/validation/candidate_bundle.json)
          echo "bundle_dir=data/models/bundles/$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Archive signed candidate and exact fitting evidence
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          python scripts/archive_model_candidate.py \
            --bundle-dir "${{ steps.package-challenger.outputs.bundle_dir }}" \
            --retain-evidence --report data/validation/candidate_archive.json

      - name: Register candidate and preserve frozen challenger
        id: register-candidate
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          python scripts/model_control_plane.py register \
            --candidate-manifest data/validation/candidate_bundle.json \
            --report data/validation/candidate_registration.json
          {
            echo "bundle_dir=$(jq -r .evaluation_bundle_dir data/validation/candidate_registration.json)"
            echo "manifest=$(jq -r .evaluation_manifest data/validation/candidate_registration.json)"
            echo "evidence_dir=$(jq -r .evaluation_evidence_dir data/validation/candidate_registration.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Persist candidate registry before live forecast gates
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh --candidate-control-only

      - name: Shadow-score upcoming earnings with the challenger
        id: shadow-score
        run: |
          python scripts/daily_score.py \
            --days-ahead 21 \
            --models-dir "${{ steps.register-candidate.outputs.bundle_dir }}" \
            --output-path data/validation/candidate_forecasts.parquet
          ROWS=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/validation/candidate_forecasts.parquet')))")
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          if [ -f data/models/control/champion.json ]; then
            CHAMPION_ID=$(jq -r .champion_bundle_id data/models/control/champion.json)
            python scripts/daily_score.py \
              --days-ahead 21 \
              --models-dir "data/models/bundles/$CHAMPION_ID" \
              --output-path data/validation/champion_forecasts.parquet
          fi

      - name: Gate — validate retrain forecasts
        if: steps.activation-data.outputs.status == 'passed' && steps.shadow-score.outputs.rows != '0'
        run: |
          python scripts/validate_ml_pipeline.py forecasts \
            --forecast-path data/validation/candidate_forecasts.parquet \
            --models-dir "${{ steps.register-candidate.outputs.bundle_dir }}" \
            --report data/validation/retrain_forecasts.json \
            --publish-receipt-dir data/validation/candidate_receipts

      - name: Upload retrain forecast validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrain-forecast-validation
          path: data/validation/retrain_forecasts.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Champion/challenger promotion decision
        id: model-decision
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          python scripts/model_control_plane.py decide \
            --candidate-manifest "${{ steps.register-candidate.outputs.manifest }}" \
            --archived-evidence-dir "${{ steps.register-candidate.outputs.evidence_dir }}" \
            --candidate-forecast data/validation/candidate_forecasts.parquet \
            --champion-forecast data/validation/champion_forecasts.parquet \
            --activation-gate-report data/validation/retrain_activation.json \
            --report data/validation/model_decision.json
          echo "promoted=$(jq -r .promoted data/validation/model_decision.json)" >> "$GITHUB_OUTPUT"

      - name: Record fitting and independent-evidence disposition
        run: |
          LEARNING_DECISION=data/validation/candidate_registration.json
          if [ "$(jq -r .bundle_id data/validation/candidate_bundle.json)" = "$(jq -r .candidate_bundle_id data/validation/model_decision.json)" ]; then
            LEARNING_DECISION=data/validation/model_decision.json
          fi
          python scripts/research/independent_model_evaluation.py report-learning \
            --bundle-dir "${{ steps.package-challenger.outputs.bundle_dir }}" \
            --decision "$LEARNING_DECISION" \
            --report data/models/evaluations/learning_${{ github.run_id }}.json

      - name: Gate — validate promoted production forecast
        if: steps.model-decision.outputs.promoted == 'true'
        run: |
          FORECAST_PATH=$(jq -r .production_forecast data/validation/model_decision.json)
          python scripts/validate_ml_pipeline.py forecasts \
            --forecast-path "$FORECAST_PATH" \
            --models-dir "${{ steps.register-candidate.outputs.bundle_dir }}" \
            --report data/validation/promoted_forecasts.json \
            --publish-receipt-dir data/forecasts/receipts

      - name: Upload retained candidate and prospective evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-model-evaluation
          path: |
            data/models/evaluations/**
            data/models/candidates/**/evidence.json
            data/validation/candidate_archive.json
            data/validation/candidate_registration.json
            data/validation/historical_training_admission.json
            data/validation/retrain_activation.json
          if-no-files-found: ignore
          retention-days: 365

      - name: Upload model control decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-control-decision
          path: |
            data/validation/model_decision.json
            data/validation/candidate_bundle.json
            data/validation/promoted_forecasts.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Push activated models to R2
        if: steps.model-decision.outputs.promoted == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python scripts/verify_retrain_data_gate.py --report data/validation/final_activation.json
          bash scripts/r2_push.sh --model-recovery

      - name: Sync Railway serving models
        id: sync-railway-models
        if: steps.model-decision.outputs.promoted == 'true'
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::ADMIN_API_KEY is required to activate a promoted or rolled-back model."
            exit 1
          fi
          python scripts/activate_model_bundle.py \
            --decision data/validation/model_decision.json \
            --receipt data/validation/serving_activation.json
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Upload serving activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-serving-activation
          path: data/validation/serving_activation.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Import exact retrain forecast into Neon
        if: steps.sync-railway-models.outputs.synced == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          EXPECTED_BUNDLE_ID=$(jq -er .champion_bundle_id data/validation/model_decision.json)
          FORECAST_PATH=$(jq -r '.production_forecast // empty' data/validation/model_decision.json)
          if [ -z "$FORECAST_PATH" ]; then
            echo "::error::No exact promoted forecast path was recorded."
            exit 1
          fi
          python -u scripts/import_recent_to_postgres.py \
            --file "$FORECAST_PATH" \
            --full \
            --require-database \
            --expected-model-bundle-id "$EXPECTED_BUNDLE_ID" \
            --activation-receipt data/validation/serving_activation.json \
            --receipt data/validation/forecast_import.json

      - name: Persist retained candidate control and outcome evidence
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh --candidate-control-only

      - name: Upload exact-bundle forecast import receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-forecast-import
          path: data/validation/forecast_import.json
          if-no-files-found: ignore
          retention-days: 90
