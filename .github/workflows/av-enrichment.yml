name: Manual provider-signal research

# Manual-only research collection. Production collection, dashboard publication,
# and ML use remain frozen by config/provider_signal_policy.json until a pinned
# paired walk-forward test proves incremental value at no added monthly cost.
#
# Isolation from the morning run:
#   • --ledger uses a fresh per-run file (the committed morning ledger would
#     show both keys exhausted). 10/key keeps per-key cumulative use across
#     both runs ≤ ~25 in case AV also tracks per key.
#   • --output-dir writes to data/provider_enrichments_pm/ so the morning
#     tables are never clobbered; consumers can union both dirs.
on:
  workflow_dispatch: {}

concurrency:
  group: av-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Collect isolated AV research sample
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPHAVANTAGE_API_KEY_2: ${{ secrets.ALPHAVANTAGE_API_KEY_2 }}
          ALPHAVANTAGE_DAILY_CALL_LIMIT: "10"
        run: |
          python scripts/sync_provider_enrichments.py \
            --research-override \
            --allow-missing-key \
            --providers alphavantage \
            --max-symbols 16 \
            --max-total-calls 25 \
            --ledger data/provider_usage_ledger_pm.json \
            --output-dir data/provider_enrichments_pm \
            --respect-minute-limits

      - name: Upload research sample (never publish to main)
        uses: actions/upload-artifact@v4
        with:
          name: provider-signal-research-${{ github.run_id }}
          path: |
            data/provider_usage_ledger_pm.json
            data/provider_enrichments_pm/
          if-no-files-found: error
          retention-days: 14
