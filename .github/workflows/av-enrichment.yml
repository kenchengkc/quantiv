name: Manual provider-signal research

# Manual-only research collection. Production collection, dashboard publication,
# and ML use remain frozen by config/provider_signal_policy.json until a pinned
# paired walk-forward test proves incremental value at no added monthly cost.
#
# Isolation from the morning run:
#   • --ledger uses a fresh per-run file (the committed morning ledger would
#     show both keys exhausted). 10/key keeps per-key cumulative use across
#     both runs ≤ ~25 in case AV also tracks per key.
#   • --output-dir writes below data/research/provider_signals/ so the morning
#     tables are never clobbered; consumers can union both dirs explicitly.
on:
  workflow_dispatch: {}

concurrency:
  group: av-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Collect isolated AV research sample
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPHAVANTAGE_API_KEY_2: ${{ secrets.ALPHAVANTAGE_API_KEY_2 }}
          ALPHAVANTAGE_DAILY_CALL_LIMIT: "10"
        run: |
          python scripts/sync_provider_enrichments.py \
            --research-override \
            --allow-missing-key \
            --providers alphavantage \
            --max-symbols 16 \
            --max-total-calls 25 \
            --ledger data/research/provider_signals/pm/usage_ledger.json \
            --output-dir data/research/provider_signals/pm/enrichments \
            --respect-minute-limits

      - name: Upload research sample (never publish to main)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-signal-research-${{ github.run_id }}
          path: |
            data/research/provider_signals/pm/usage_ledger.json
            data/research/provider_signals/pm/enrichments/
          if-no-files-found: error
          retention-days: 14
