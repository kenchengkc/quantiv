name: One-shot post-merge refresh and retrain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-merge-refresh-retrain.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: post-merge-refresh-retrain-once
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch daily refresh without duplicate Sunday sweep and wait
        shell: bash
        run: |
          set -euo pipefail
          daily_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          echo "Dispatching Daily data refresh at $daily_sha"
          gh workflow run data-refresh.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f finnhub_profile_refresh=auto \
            -f run_sunday_finnhub_sweep=false

          daily_id=""
          for _ in $(seq 1 30); do
            daily_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow data-refresh.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$daily_sha\") | .databaseId" \
              | head -n1)"
            [ -n "$daily_id" ] && break
            sleep 2
          done
          if [ -z "$daily_id" ]; then
            echo "::error::Could not identify dispatched Daily data refresh run"
            exit 1
          fi
          echo "Daily run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$daily_id"
          gh run watch "$daily_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Dispatch weekly retrain from refreshed main and wait
        shell: bash
        run: |
          set -euo pipefail
          weekly_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          echo "Dispatching Weekly model retrain at $weekly_sha"
          gh workflow run model-retrain.yml --repo "$GITHUB_REPOSITORY" --ref main

          weekly_id=""
          for _ in $(seq 1 30); do
            weekly_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow model-retrain.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$weekly_sha\") | .databaseId" \
              | head -n1)"
            [ -n "$weekly_id" ] && break
            sleep 2
          done
          if [ -z "$weekly_id" ]; then
            echo "::error::Could not identify dispatched Weekly model retrain run"
            exit 1
          fi
          echo "Weekly run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$weekly_id"
          gh run watch "$weekly_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Remove one-shot dispatcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/post-merge-refresh-retrain.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            echo "One-shot dispatcher already absent."
            exit 0
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='Remove one-shot post-merge refresh/retrain dispatcher' \
            -f sha="$sha" \
            -f branch=main >/dev/null
          echo "Removed $path from main."
