name: Deploy daily refresh scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/daily-refresh-scheduler
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify scheduler tests
        run: node --test src/index.test.mjs

      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts wrangler@4.40.2

      - name: Upload GitHub dispatch token as Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAILY_REFRESH_SCHEDULER_GITHUB_TOKEN: ${{ secrets.DAILY_REFRESH_SCHEDULER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DAILY_REFRESH_SCHEDULER_GITHUB_TOKEN" ]; then
            echo "Missing DAILY_REFRESH_SCHEDULER_GITHUB_TOKEN" >&2
            exit 1
          fi
          printf '%s' "$DAILY_REFRESH_SCHEDULER_GITHUB_TOKEN" |
            npx wrangler secret put GITHUB_TOKEN

      - name: Deploy Worker and Cron Triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
