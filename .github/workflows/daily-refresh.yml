name: Daily data refresh

# Nightly pipeline (cron `0 11 * * *`):
#   1. Pull parquet + models from Cloudflare R2
#   2. sync_dolthub — pull the latest options_chain / earnings / ohlcv rows
#      then overlay near-term earnings from Finnhub when FINNHUB_API_KEY exists
#   3. Push changed parquet back to R2
#   4. setup_duckdb → daily_score → build_frontend_data
#   5. Commit JSON + push → Vercel auto-deploys
#
# Weekly ML retrain (cron `0 12 * * 0` — Sunday 12:00 UTC):
#   Pull R2 → DuckDB → feature_engineering_v3 → model_trainer_v3 → push models
#   (no DoltHub sync; assumes nightly runs keep R2 fresh. Models land in R2 for
#   daily_score on the next nightly pull.)
#
# Designed for public repo (unlimited free runner minutes). Runtime per run
# ≈ 15–25 min dominated by build_frontend_data + DuckDB parquet scans.

on:
  schedule:
    # 11:00 UTC = 07:00 ET. Runs after US markets close + DoltHub has caught up.
    - cron: '0 11 * * *'
    # Sunday 12:00 UTC — weekly LightGBM retrain (v3 features + point/quantile).
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      warn_only_integrity:
        description: "Run earnings_calendar integrity gate in --warn-only mode (commit even if guardrails trip). Use for legitimate large changes like a one-time universe cleanup."
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *')
    runs-on: ubuntu-latest
    # 45 min covers Mon-Sat. Sunday triggers the full-universe Finnhub
    # sweep below (~110 min @ 60 calls/min for 6.6k tickers) → bumped to
    # 180 min to leave headroom for build_frontend_data + R2 push too.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl -sSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Pull data from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_pull.sh

      - name: Sync latest options chain from DoltHub
        run: python scripts/sync_dolthub.py

      - name: Sync earnings calendar
        run: python scripts/sync_dolthub.py --earnings

      - name: Overlay near-term earnings from Finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/sync_finnhub_earnings.py --allow-missing-key

      - name: Sunday full-universe Finnhub sweep
        # Walks every ticker that reported in the last 2 years (~6,600
        # symbols) with a 1-call-per-symbol per-symbol query. Catches the
        # "last reported" actuals that the broad daily fetch misses
        # (broad only returns ~7 days of historical events).
        #
        # Only runs on Sundays since market is closed → no contention with
        # intraday live-quote workers for the 60/min rate budget. At
        # delay=1.05s the sweep stays under ~57/min with margin and
        # finishes in ~2 hours.
        #
        # Free-tier per-symbol query is forward-only — past quarters can't
        # be backfilled. This step is what makes EPS-surprise history fill
        # in over weeks instead of leaving stale tickers permanently null.
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          DOW=$(date -u +%u)  # 1=Mon … 7=Sun
          if [ "$DOW" != "7" ]; then
            echo "Not Sunday (UTC weekday=$DOW); skipping full-universe Finnhub sweep."
            exit 0
          fi
          python scripts/sync_finnhub_earnings.py \
            --all-recent \
            --delay 1.05 \
            --max-calls 8000 \
            --allow-missing-key

      - name: Sync OHLCV
        run: python scripts/sync_dolthub.py --ohlcv

      - name: Sync volatility history
        run: python scripts/sync_dolthub.py --volhist

      - name: Sync VIX (FRED)
        run: python scripts/sync_vix.py

      - name: Push updated data to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh

      - name: Rebuild DuckDB views
        run: python scripts/setup_duckdb_from_parquet.py

      - name: Gate — verify data freshness before scoring
        # Fails the workflow if any core view is empty, too stale, or has
        # duplicate rows. Prevents pushing a bad weekly.json to prod when
        # an upstream sync silently broke.
        run: python scripts/check_duckdb_freshness.py --strict --max-lag-days 5

      - name: Score upcoming earnings
        run: python scripts/daily_score.py --days-ahead 21

      - name: Build popular-ticker weights
        # Regenerate apps/frontend/lib/popular.ts from the top 100 tickers
        # by 90-day dollar volume (filtered to symbols with earnings).
        # Captures retail favorites (HOOD/MSTR/PLTR/COIN) and recent IPOs
        # (CRWV/RKLB/CRCL) without hand-curation. Replaces the stale
        # 47-entry static map.
        run: python -u tools/build_popular_weights.py

      - name: Build frontend JSON
        run: python -u tools/build_frontend_data.py

      - name: Refresh ticker names if DoltHub introduced new tickers
        # Cheap diff: extract distinct act_symbols from the just-synced
        # DoltHub parquet, compare to keys in apps/frontend/public/
        # ticker-names.json. If DoltHub now prices options on a ticker
        # we don't yet have a display name for, run the SEC EDGAR ingest
        # to refresh names. Most days this is a no-op; a typical month
        # has 2-5 days where a new IPO / re-listing lands in DoltHub.
        #
        # Costs are tiny: duckdb + the parquet read are already on disk,
        # and `node scripts/build_ticker_names.mjs` only commits if the
        # SEC JSON actually changed (the script's `git diff --quiet`
        # early-exit handles SEC also having no record yet). The
        # downstream "Commit + push frontend data" step picks up the
        # updated ticker-names.json in the same push as the daily data.
        run: |
          python3 -c "
          import duckdb, glob, sys
          files = sorted(glob.glob('data/parquet/options_chain/**/*.parquet', recursive=True))
          if not files:
              sys.exit(0)
          rows = duckdb.connect().execute(
              'SELECT DISTINCT act_symbol FROM read_parquet(?)', [files]
          ).fetchall()
          print('\n'.join(r[0] for r in rows if r[0]))
          " | sort -u > /tmp/dolt_tickers.txt

          jq -r 'keys[]' apps/frontend/public/ticker-names.json | sort -u > /tmp/known_names.txt

          NEW=$(comm -23 /tmp/dolt_tickers.txt /tmp/known_names.txt)
          if [ -n "$NEW" ]; then
            echo "DoltHub now prices options on tickers without display names:"
            echo "$NEW" | head -20
            COUNT=$(echo "$NEW" | wc -l)
            echo "(${COUNT} total — refreshing from SEC EDGAR)"
            node scripts/build_ticker_names.mjs
          else
            echo "No forecast-eligible tickers missing display names — skipping EDGAR refresh."
          fi

      - name: Gate — earnings_calendar integrity
        # Prints a structured diff of the about-to-be-committed CSV vs HEAD
        # and aborts if any guardrail trips (row drop >2.5%, >50 tickers
        # vanish, >400 past-30d events vanish, >150 next-60d events
        # vanish, or any anchor ticker with ≥10 prior rows loses all
        # rows). Wired in after the 2026-05-18 incident where a left-join
        # in sync_dolthub silently dropped ~960 Finnhub-discovered
        # upcoming earnings rows.
        #
        # warn_only_integrity input lets a workflow_dispatch run accept
        # a legitimate large change (e.g. a one-time universe cleanup)
        # without changing thresholds — diff still prints to the log.
        run: |
          python scripts/check_earnings_calendar_integrity.py \
            ${{ github.event.inputs.warn_only_integrity == 'true' && '--warn-only' || '' }}

      - name: Commit + push frontend data
        # data/forecasts is gitignored — the JSON in apps/frontend/public is
        # the only thing that ships to Vercel. Forecast parquet stays in R2.
        #
        # data/earnings_calendar.csv is tracked: every run merges DoltHub
        # baseline + Finnhub overlay back into the canonical CSV. Committing
        # it lets EPS/revenue surprise actuals accumulate over time instead
        # of being re-fetched (and lost) on every run. Finnhub free tier
        # only returns the most recent reported event per symbol, so without
        # persistence the historical chart can never deepen past 1 quarter.
        #
        # `git add -f` on the CSV is required because data/ is broadly
        # gitignored — git can't re-include a file via !data/earnings_calendar.csv
        # when the parent directory is excluded.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "Quantiv bot"
          git add apps/frontend/public apps/frontend/lib/popular.ts
          git add -f data/earnings_calendar.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily refresh $(date -u +%Y-%m-%d)"
            git push origin main
          fi

  # Weekly only — see `on.schedule` second cron. Does not commit to git; uploads
  # new joblibs + metadata to R2 under data/models (see scripts/r2_push.sh).
  weekly-retrain:
    if: github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl -sSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Pull data from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_pull.sh

      - name: Rebuild DuckDB views
        run: python scripts/setup_duckdb_from_parquet.py

      - name: Gate — verify data freshness before ML
        run: python scripts/check_duckdb_freshness.py --strict --max-lag-days 5

      - name: Build ML training parquet (v3)
        # Window matches what you A/B-tested locally. start-date 2023-01-01
        # = full options + OHLCV coverage. end-date = today so we capture the
        # latest earnings; pre-earnings rows older than today still survive
        # the WHERE filter inside the SQL.
        run: |
          END=$(date -u +%Y-%m-%d)
          python apps/ml/feature_engineering_v3.py \
            --start-date 2023-01-01 \
            --end-date "$END"

      - name: Train LightGBM models (v3, tuned + time-decay)
        # Locked-in production settings (settled on after local A/B):
        #   --tune              Optuna search per horizon (30 trials × 6 horizons ≈ 7 min)
        #   --time-decay 0.5    half-life 0.5y — modest recency bias on top of VIX features
        run: python apps/ml/model_trainer_v3.py --tune --time-decay 0.5

      - name: Score upcoming earnings with the new models
        run: python scripts/daily_score.py --days-ahead 21

      - name: Push models to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh
