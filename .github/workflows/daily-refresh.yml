name: Daily data refresh

# Nightly (11:00 UTC): R2 pull → core data sync → R2 push → DuckDB → score →
# frontend JSON → commit. Weekly Sunday 12:00 UTC: retrain
# (feature_engineering → model_trainer → score). Retrain pulls the earnings
# calendar from R2 because it can start before the daily commit lands.

on:
  schedule:
    # 11:00 UTC = 07:00 ET. Runs after US markets close + DoltHub has caught up.
    - cron: '0 11 * * *'
    # Sunday 12:00 UTC — weekly model retrain.
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      run_refresh:
        description: "Run the data refresh job. Disable for a retrain-only validation cycle."
        type: boolean
        default: true
      warn_only_integrity:
        description: "Run earnings_calendar integrity gate in --warn-only mode (commit even if guardrails trip). Use for legitimate large changes like a one-time universe cleanup."
        type: boolean
        default: false
      finnhub_profile_refresh:
        description: "Finnhub profile/logo sweep. auto runs missing-only on Saturdays; full refetches every ticker for maintenance."
        type: choice
        options:
          - auto
          - missing-only
          - full
          - skip
        default: auto
      run_retrain:
        description: "Run the complete gated ML retraining and signed model promotion cycle."
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # detect_delistings.py opens ticker-lifecycle issues

jobs:
  refresh:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_refresh) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *')
    runs-on: ubuntu-latest
    # 45 min covers Mon-Sat. Sunday triggers the full-universe Finnhub
    # sweep below (~110 min @ 60 calls/min for 6.6k tickers) → bumped to
    # 180 min to leave headroom for build_frontend_data + R2 push too.
    timeout-minutes: 180
    env:
      # Schedule-dispatch jitter + a slow DoltHub merge can push the non-price
      # Finnhub steps (earnings overlay, market holidays) past the 09:25 ET
      # quote-refresh guard. Soft-skip those steps (exit 0) instead of aborting
      # the whole refresh, so scoring, the frontend rebuild, and the commit
      # still run and the site data doesn't go stale. See
      # provider_market_hours.block_finnhub_reserved_window.
      FINNHUB_RESERVED_WINDOW_SOFT_SKIP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl -sSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Pull data from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_pull.sh

      - name: Sync latest options chain from DoltHub
        run: python scripts/sync_dolthub.py

      - name: Sync earnings calendar
        run: python scripts/sync_dolthub.py --earnings

      - name: Overlay near-term earnings from Finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set +e
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python scripts/sync_finnhub_earnings.py --allow-missing-key --delay 1.05 --max-calls 5 $EXTRA_ARGS
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              exit "$status"
            fi
            echo "::warning::Finnhub earnings overlay failed with exit $status; continuing scheduled refresh so OHLCV, realized moves, frontend JSON, and commit still run."
          fi

      - name: Overlay EPS and revenue from FMP
        # Complements Finnhub's date/timing overlay with richer EPS/revenue
        # actual and estimate coverage. Runs at 07:00 ET, before the Finnhub
        # live quote polling window begins.
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/sync_fmp_earnings.py --allow-missing-key --allow-quota-exhausted --no-date-params

      - name: Backfill FMP EPS and revenue history by symbol
        # The current FMP free-tier key rejects /stable/earnings?symbol=SYM
        # with a plan-level 402, so keep this disabled until the plan supports
        # the symbol endpoint. Set repository variable
        # ENABLE_FMP_SYMBOL_BACKFILL=1 after upgrading/re-verifying.
        if: ${{ vars.ENABLE_FMP_SYMBOL_BACKFILL == '1' }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python scripts/backfill_fmp_earnings_by_symbol.py \
            --allow-missing-key \
            --max-calls 240 \
            --delay 0.25 \
            --refresh-after-days 90

      - name: Refresh cached US market holidays
        # Non-price Finnhub call. A scheduled run can be delayed by GitHub into
        # the 09:25-16:45 ET quote window (happened 2026-06-15, a ~2h delay put
        # this step at 09:30 ET); when it is, --skip-during-market-hours makes it
        # exit 0 rather than fail. The holiday cache changes only a few times a
        # year, so a skipped day is harmless. A manual run passes
        # --allow-market-hours to force a refresh. continue-on-error keeps any
        # holiday-sync hiccup from aborting the data build/commit below — this
        # metadata refresh must never gate the daily data ship.
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          EXTRA_ARGS="--skip-during-market-hours"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python scripts/sync_finnhub_market_holidays.py --allow-missing-key $EXTRA_ARGS

      - name: Sunday full-universe Finnhub sweep
        # Walks every ticker that reported in the last 2 years (~6,600
        # symbols) with a 1-call-per-symbol per-symbol query. Catches the
        # "last reported" actuals that the broad daily fetch misses
        # (broad only returns ~7 days of historical events).
        #
        # Only runs on Sundays since market is closed → no contention with
        # intraday live-quote workers for the 60/min rate budget. At
        # delay=1.05s the sweep stays under ~57/min with margin and
        # finishes in ~2 hours.
        #
        # Free-tier per-symbol query is forward-only — past quarters can't
        # be backfilled. This step is what makes EPS-surprise history fill
        # in over weeks instead of leaving stale tickers permanently null.
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          DOW=$(date -u +%u)  # 1=Mon … 7=Sun
          if [ "$DOW" != "7" ]; then
            echo "Not Sunday (UTC weekday=$DOW); skipping full-universe Finnhub sweep."
            exit 0
          fi
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python scripts/sync_finnhub_earnings.py \
            --all-recent \
            --delay 1.05 \
            --max-calls 8000 \
            --allow-missing-key \
            $EXTRA_ARGS

      - name: Apply manual earnings overrides
        # Re-applies config/earnings_overrides.json on top of the provider
        # syncs above so manual date/timing corrections survive the nightly
        # re-pull. Must run after all earnings syncs and before the build.
        run: python scripts/apply_earnings_overrides.py --allow-missing

      - name: Detect delistings (exchange-directory diff)
        # Run before the integrity gate and before the expensive OHLCV/scoring/
        # frontend steps, so legitimate delistings are recorded up front and
        # true earnings-calendar regressions abort early instead of after the
        # rest of the refresh has already spent runner time.
        #
        # Cross-references our active forecast universe against the authoritative
        # NASDAQ/NYSE listing directories. A forecast-page ticker absent for ≥3
        # consecutive days (tracked in data/delisting_watch.json) is auto-recorded
        # in config/delisted_tickers.json, so the integrity gate below and
        # tomorrow's sync_dolthub drop it cleanly instead of tripping the
        # anchor/vanished guards. Ticker renames (company still listed under a new
        # symbol, e.g. BK→BNY) are detected by name and surfaced for a manual
        # remap — never auto-delisted. --allow-fetch-failure: a directory fetch
        # hiccup must never break the nightly build. --notify-github opens a
        # tracking issue per suspected rename / auto-promoted delisting
        # (idempotent by title) so they surface in your GitHub notifications.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/detect_delistings.py --allow-fetch-failure --notify-github

      - name: Gate — earnings_calendar integrity
        # Prints a structured diff of the about-to-be-committed CSV vs HEAD
        # and aborts if any guardrail trips (row drop >2.5%, >50 tickers
        # vanish, >400 past-30d events vanish, >150 next-60d events
        # vanish, any blank act_symbol in the new CSV, or any anchor ticker with ≥10 prior rows loses all
        # rows). Wired in after the 2026-05-18 incident where a left-join
        # in sync_dolthub silently dropped ~960 Finnhub-discovered
        # upcoming earnings rows.
        #
        # warn_only_integrity input lets a workflow_dispatch run accept
        # a legitimate large change (e.g. a one-time universe cleanup)
        # without changing thresholds — diff still prints to the log.
        run: |
          python scripts/check_earnings_calendar_integrity.py \
            ${{ github.event.inputs.warn_only_integrity == 'true' && '--warn-only' || '' }}

      - name: Sync OHLCV
        run: python scripts/sync_dolthub.py --ohlcv

      - name: Sync volatility history
        run: python scripts/sync_dolthub.py --volhist

      - name: Sync VIX (CBOE)
        # Auxiliary macro series (not required to build the frontend). The
        # script pulls CBOE's official VIX history CSV with retry/backoff;
        # continue-on-error covers a genuine source outage so a single missed
        # VIX day can't abort the whole refresh.
        continue-on-error: true
        run: python scripts/sync_vix.py

      - name: Rebuild DuckDB views
        run: python scripts/setup_duckdb_from_parquet.py

      - name: Gate — verify data freshness before scoring
        # Fails the workflow if any core view is empty, too stale, or has
        # duplicate rows. Prevents pushing a bad weekly.json to prod when
        # an upstream sync silently broke.
        run: python scripts/check_duckdb_freshness.py --strict --max-lag-days 5

      - name: Build reconciliation control manifest
        # Reuses the local DuckDB views and checked-in mapping files. This is
        # an exception-first JSON artifact, not a Redis/Neon control table.
        # Critical exceptions fail closed; known instrumentation gaps remain
        # visible as warnings while their controls are built out.
        run: |
          python scripts/build_data_reconciliation.py \
            --strict \
            --max-lag-days 5 \
            --days-ahead 21 \
            --report data/validation/data_reconciliation.json

      - name: Upload data reconciliation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-reconciliation
          path: data/validation/data_reconciliation.json
          if-no-files-found: ignore
          retention-days: 30

      # Publication happens only after source counts, hashes, replay,
      # quote quality, quarantine, freshness, and event coverage pass.
      - name: Promote reconciled parquet and controls to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh --skip-forecasts

      - name: Score upcoming earnings
        run: python scripts/daily_score.py --days-ahead 21

      - name: Gate — validate scored ML and IV forecasts
        # Fail before Neon/R2/frontend publication when forecast magnitudes,
        # quantiles, feature schemas, IV math, or model handoffs are corrupt.
        # The receipt is stored beside the existing forecast artifacts, so the
        # existing R2 sync publishes it without Redis/Neon writes or a new job.
        run: |
          python scripts/validate_ml_pipeline.py forecasts \
            --report data/validation/daily_forecasts.json \
            --publish-receipt-dir data/forecasts/receipts

      - name: Upload daily forecast validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-forecast-validation
          path: data/validation/daily_forecasts.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Monitor champion, shadows, and feature drift
        # A compact signed Parquet ledger in R2 replaces a new Redis/Neon
        # workload. Critical feature drift fails before forecast publication.
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          if [ -f data/models/control/champion.json ]; then
            python scripts/model_control_plane.py monitor
          else
            echo "No signed champion yet; monitoring begins after the first gated retrain."
          fi

      - name: Import recent forecasts to Neon Postgres
        # Pushes the newest forecast snapshot into the em_forecasts table
        # the Railway-hosted FastAPI backend reads from. The script is a
        # no-op when DATABASE_URL is unset (forks / preview branches).
        #
        # Non-blocking: later steps (R2 push, frontend build, commit) read
        # DuckDB/parquet, not Postgres, so a transient Neon outage must not
        # abort the whole refresh. The script already retries with backoff;
        # continue-on-error covers a genuine outage so the frontend still ships
        # (the step still shows red in the Actions UI for visibility).
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Import the whole nightly Parquet — rows use chain snapshot_date
        # (often 1–25d before earnings), not "today", so --days 1 kept ~2 rows.
        run: python -u scripts/import_recent_to_postgres.py --full

      - name: Push forecasts to R2
        # daily_score runs after the first r2_push — without this step new
        # forecasts_YYYY-MM-DD.parquet never leaves the runner (May 2026 bug).
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh --forecasts-only

      - name: Pull market caps (weekly cache)
        # Refresh data/market_caps.json from Finnhub /stock/profile2 for
        # the top 500 tickers by dollar volume. Script is a no-op if the
        # cache is < 7 days old, so this only fires once a week even
        # though it runs every daily cycle. Market caps change slowly;
        # 7-day freshness is more than enough for the popular-set
        # composite, and weekly fetch keeps Finnhub budget impact small
        # (~500 calls/week, well within the 60/min free tier).
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--allow-market-hours"
          fi
          python -u tools/pull_market_caps.py --allow-missing-key $EXTRA_ARGS

      - name: Build popular-ticker weights
        # Regenerate apps/frontend/lib/popular.ts from a composite score:
        #   0.5 × log(90d dollar volume) + 0.5 × log(market cap)
        # Captures BOTH activity (retail favorites HOOD/MSTR/PLTR/COIN)
        # AND size (household names ABNB/CMG/ORLY/RBLX), unlike pure
        # dollar volume which puts volatile penny semis (AXTI, CLS) in
        # the same bucket as steady big-cap brands.
        run: python -u tools/build_popular_weights.py

      - name: Build frontend JSON
        env:
          # Only TWELVEDATA_API_KEY needs to be configured as a GitHub secret.
          # The remaining values pin the Basic-tier defaults so repo variables
          # are not required for the nightly build to stay within quota.
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_REALIZED_FALLBACK: "1"
          TWELVEDATA_DAILY_CREDIT_LIMIT: "792"
          TWELVEDATA_BATCH_SIZE: "8"
          TWELVEDATA_BATCH_DELAY_SEC: "61"
          TWELVEDATA_VALIDATION_SAMPLE_SIZE: "8"
          TWELVEDATA_VALIDATION_DELTA_PCT: "0.005"
          TWELVEDATA_SHARE_PROVIDER_LEDGER: "1"
        run: python -u tools/build_frontend_data.py

      - name: Refresh ticker names if DoltHub introduced new tickers
        # Cheap diff: extract distinct act_symbols from the just-synced
        # DoltHub parquet, compare to keys in apps/frontend/public/
        # ticker-names.json. If DoltHub now prices options on a ticker
        # we don't yet have a display name for, run the SEC EDGAR ingest
        # to refresh names. Most days this is a no-op; a typical month
        # has 2-5 days where a new IPO / re-listing lands in DoltHub.
        #
        # Costs are tiny: duckdb + the parquet read are already on disk,
        # and `node scripts/build_ticker_names.mjs` only commits if the
        # SEC JSON actually changed (the script's `git diff --quiet`
        # early-exit handles SEC also having no record yet). The
        # downstream "Commit + push frontend data" step picks up the
        # updated ticker-names.json in the same push as the daily data.
        run: |
          python3 -c "
          import duckdb, glob, sys
          files = sorted(glob.glob('data/parquet/options_chain/**/*.parquet', recursive=True))
          if not files:
              sys.exit(0)
          rows = duckdb.connect().execute(
              'SELECT DISTINCT act_symbol FROM read_parquet(?)', [files]
          ).fetchall()
          print('\n'.join(r[0] for r in rows if r[0]))
          " | sort -u > /tmp/dolt_tickers.txt

          jq -r 'keys[]' apps/frontend/public/ticker-names.json | sort -u > /tmp/known_names.txt

          NEW=$(comm -23 /tmp/dolt_tickers.txt /tmp/known_names.txt)
          if [ -n "$NEW" ]; then
            echo "DoltHub now prices options on tickers without display names:"
            echo "$NEW" | head -20
            COUNT=$(echo "$NEW" | wc -l)
            echo "(${COUNT} total — refreshing from SEC EDGAR)"
            node scripts/build_ticker_names.mjs
          else
            echo "No forecast-eligible tickers missing display names — skipping EDGAR refresh."
          fi

      - name: Commit + push frontend data
        # data/forecasts is gitignored — the JSON in apps/frontend/public is
        # the only thing that ships to Vercel. Forecast parquet stays in R2.
        #
        # data/earnings_calendar.csv is tracked: every run merges DoltHub
        # baseline + Finnhub overlay back into the canonical CSV. Committing
        # it lets EPS/revenue surprise actuals accumulate over time instead
        # of being re-fetched (and lost) on every run. Finnhub free tier
        # only returns the most recent reported event per symbol, so without
        # persistence the historical chart can never deepen past 1 quarter.
        #
        # `git add -f` on the CSV is required because data/ is broadly
        # gitignored — git can't re-include a file via !data/earnings_calendar.csv
        # when the parent directory is excluded.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "Quantiv bot"
          git add apps/frontend/public apps/frontend/lib/popular.ts apps/frontend/lib/marketHolidays.generated.ts
          git add config/delisted_tickers.json config/ticker_renames.json
          git add -f data/earnings_calendar.csv data/market_caps.json
          # Snapshot + diff log are gitignored under /data/ but need to
          # persist across CI runs so tomorrow's build can diff against
          # today. -f force-includes them past the gitignore. We loop
          # with [ -f ... ] guards so a missing file (e.g. the changes
          # log on the very first run, before any diff entries land)
          # doesn't tank the commit step with a pathspec error.
          for f in data/popular_snapshot.json data/popular_changes.jsonl data/fmp_earnings_metadata.json data/fmp_earnings_backfill_state.json data/delisting_watch.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
            else
              echo "skipping $f (not present)"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily refresh $(date -u +%Y-%m-%d)"
            bash scripts/git_push_with_retry.sh origin main
          fi

  finnhub-profile-sweep:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *')
    runs-on: ubuntu-latest
    needs: refresh
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        # Full requirements (not just requests): check_ticker_identity.py imports
        # sync_finnhub_earnings, which imports pandas/pyarrow at module level.
        run: pip install -r requirements.txt

      - name: Pull latest main after daily refresh commit
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Weekly Finnhub profile/logo sweep
        # Runs separately from the main refresh job so the first long-tail
        # missing-only backfill cannot consume the normal data-refresh timeout.
        # Saturday UTC avoids weekday quote polling and the Sunday full-universe
        # earnings sweep. Manual workflow_dispatch can force missing-only or
        # full maintenance refreshes.
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PROFILE_REFRESH: ${{ github.event.inputs.finnhub_profile_refresh || 'auto' }}
        run: |
          set -euo pipefail
          MODE="$PROFILE_REFRESH"
          ARGS=()
          case "$MODE" in
            auto)
              DOW=$(date -u +%u)  # 1=Mon … 6=Sat … 7=Sun
              if [ "$DOW" != "6" ]; then
                echo "Profile sweep auto mode only runs on Saturday UTC (today=$DOW); skipping."
                exit 0
              fi
              # --force: the Saturday-only gate above already controls cadence,
              # so bypass the script's internal freshness guard (which is borderline
              # at exactly 7d between Saturdays and can skip on schedule jitter).
              # missing-only keeps it cheap — only newly-added earners are fetched.
              ARGS=(--missing-only --force)
              ;;
            missing-only)
              ARGS=(--missing-only --force)
              ;;
            full)
              ARGS=(--full --force)
              ;;
            skip)
              echo "Profile sweep skipped by workflow input."
              exit 0
              ;;
            *)
              echo "Unknown finnhub_profile_refresh mode: $MODE" >&2
              exit 2
              ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS+=(--allow-market-hours)
          fi
          # frontend universe = symbol pages + weeks + weekly + screener (~1.5k
          # rendered tickers, incl. upcoming earnings weeks). The `earnings`
          # universe (~7.9k) is almost all historical/delisted symbols from
          # earnings_calendar.csv that never render a logo — no point fetching
          # profiles for them. check_ticker_identity.py skips symbols without a
          # cached profile, so it's unaffected.
          python -u scripts/sync_finnhub_profiles.py \
            --allow-missing-key \
            --universe frontend \
            "${ARGS[@]}"
          # Data-quality lint only — the profile/logo cache above already wrote
          # successfully. Warn (don't abort) so a residual foreign-venue leak or
          # a cosmetic SEC-vs-Finnhub name diff can't fail the whole daily
          # workflow; issues still print to the log for follow-up.
          python scripts/check_ticker_identity.py --warn-only

      - name: Commit + push Finnhub profile/logo cache
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "Quantiv bot"
          git add apps/frontend/public/ticker-logos.json
          if git diff --staged --quiet; then
            echo "No Finnhub profile/logo cache changes to commit"
          else
            git commit -m "refresh Finnhub profile logos $(date -u +%Y-%m-%d)"
            bash scripts/git_push_with_retry.sh origin main
          fi

  # Weekly or explicitly dispatched. Does not commit model artifacts to git;
  # uploads signed native-LightGBM bundles to R2 under data/models.
  weekly-retrain:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_retrain)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl -sSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Pull data from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PULL_EARNINGS: "1"
        run: bash scripts/r2_pull.sh

      - name: Rebuild DuckDB views
        run: python scripts/setup_duckdb_from_parquet.py

      - name: Gate — verify data freshness before ML
        run: python scripts/check_duckdb_freshness.py --strict --max-lag-days 5

      - name: Build ML training parquet
        # 2023-01-01 is when options and daily prices are both complete; end date is today.
        run: |
          END=$(date -u +%Y-%m-%d)
          python apps/ml/feature_engineering.py \
            --start-date 2023-01-01 \
            --end-date "$END"

      - name: Evaluate realized champion outcomes and automatic rollback
        id: outcome-control
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          if [ -f data/models/control/champion.json ]; then
            python scripts/model_control_plane.py evaluate-outcomes \
              --report data/validation/model_outcomes.json
            echo "rolled_back=$(jq -r .rolled_back data/validation/model_outcomes.json)" >> "$GITHUB_OUTPUT"
          else
            echo "rolled_back=false" >> "$GITHUB_OUTPUT"
            echo "No signed champion exists; skipping realized-outcome evaluation."
          fi

      - name: Upload realized model outcome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-realized-outcomes
          path: data/validation/model_outcomes.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Gate — validate training artifacts
        # Catch stale metadata, leakage-prone date splits, duplicate events,
        # invalid targets, and unusable features before the expensive tune.
        run: |
          python scripts/validate_ml_pipeline.py training \
            --report data/validation/retrain_training.json

      - name: Upload training validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-training-validation
          path: data/validation/retrain_training.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Train LightGBM models
        # --tune searches settings; --time-decay 0.5 puts more weight on the last six months.
        run: python apps/ml/model_trainer.py --tune --time-decay 0.5

      - name: Gate — mandatory purged walk-forward validation
        # Test on four later 60-day windows. Average error must beat the straddle.
        run: |
          python scripts/validate_walk_forward.py \
            --report data/validation/retrain_walk_forward.json

      - name: Upload walk-forward validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-walk-forward-validation
          path: data/validation/retrain_walk_forward.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Gate — validate trained model bundle
        # Load the models, run a test prediction, and check that the bands are the right width.
        run: |
          python scripts/validate_ml_pipeline.py models \
            --report data/validation/retrain_models.json \
            --publish-receipt-dir data/models/receipts

      - name: Upload model validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-model-validation
          path: data/validation/retrain_models.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Package signed challenger bundle
        id: package-challenger
        # The private signing key exists only in GitHub Actions. Runtime
        # services ship the pinned public key and cannot mint artifacts.
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          python scripts/package_model_bundle.py \
            --source-revision "$GITHUB_SHA" \
            --output-manifest data/validation/candidate_bundle.json
          BUNDLE_ID=$(jq -r .bundle_id data/validation/candidate_bundle.json)
          echo "bundle_dir=data/models/bundles/$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Shadow-score upcoming earnings with the challenger
        run: |
          python scripts/daily_score.py \
            --days-ahead 21 \
            --models-dir "${{ steps.package-challenger.outputs.bundle_dir }}" \
            --output-path data/validation/candidate_forecasts.parquet

      - name: Gate — validate retrain forecasts
        # Nothing is pushed or hot-loaded until the freshly trained models and
        # their forecast artifact agree end to end.
        run: |
          python scripts/validate_ml_pipeline.py forecasts \
            --forecast-path data/validation/candidate_forecasts.parquet \
            --models-dir "${{ steps.package-challenger.outputs.bundle_dir }}" \
            --report data/validation/retrain_forecasts.json \
            --publish-receipt-dir data/validation/candidate_receipts

      - name: Upload retrain forecast validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-forecast-validation
          path: data/validation/retrain_forecasts.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Champion/challenger promotion decision
        id: model-decision
        env:
          MODEL_BUNDLE_SIGNING_KEY: ${{ secrets.MODEL_BUNDLE_SIGNING_KEY }}
        run: |
          python scripts/model_control_plane.py decide \
            --candidate-manifest data/validation/candidate_bundle.json \
            --candidate-forecast data/validation/candidate_forecasts.parquet \
            --report data/validation/model_decision.json
          echo "promoted=$(jq -r .promoted data/validation/model_decision.json)" >> "$GITHUB_OUTPUT"

      - name: Gate — validate promoted production forecast
        if: steps.model-decision.outputs.promoted == 'true'
        run: |
          FORECAST_PATH=$(jq -r .production_forecast data/validation/model_decision.json)
          python scripts/validate_ml_pipeline.py forecasts \
            --forecast-path "$FORECAST_PATH" \
            --models-dir "${{ steps.package-challenger.outputs.bundle_dir }}" \
            --report data/validation/promoted_forecasts.json \
            --publish-receipt-dir data/forecasts/receipts

      - name: Rescore production after automatic rollback
        if: >-
          steps.outcome-control.outputs.rolled_back == 'true' &&
          steps.model-decision.outputs.promoted != 'true'
        run: |
          ROLLBACK_BUNDLE_ID=$(jq -r .champion_bundle_id data/validation/model_decision.json)
          ROLLBACK_MODELS_DIR="data/models/bundles/$ROLLBACK_BUNDLE_ID"
          python scripts/daily_score.py \
            --days-ahead 21 \
            --models-dir "$ROLLBACK_MODELS_DIR"
          python scripts/validate_ml_pipeline.py forecasts \
            --models-dir "$ROLLBACK_MODELS_DIR" \
            --report data/validation/rollback_forecasts.json \
            --publish-receipt-dir data/forecasts/receipts

      - name: Upload model control decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-control-decision
          path: |
            data/validation/model_decision.json
            data/validation/candidate_bundle.json
            data/validation/promoted_forecasts.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Push models to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2_push.sh

      - name: Sync Railway serving models
        id: sync-railway-models
        if: >-
          steps.model-decision.outputs.promoted == 'true' ||
          steps.outcome-control.outputs.rolled_back == 'true'
        # Hot-load the exact signed champion onto Railway's /data volume.
        # This step fails unless the backend preflights every native point and
        # quantile model and returns the same bundle ID as the control decision.
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::ADMIN_API_KEY is required to activate a promoted or rolled-back model."
            exit 1
          fi
          python scripts/activate_model_bundle.py \
            --decision data/validation/model_decision.json \
            --receipt data/validation/serving_activation.json
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Upload serving activation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-serving-activation
          path: data/validation/serving_activation.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Import retrain forecasts to Neon Postgres
        # Import only after exact-bundle activation. The importer independently
        # rejects a forecast file whose bundle ID differs from the decision.
        if: steps.sync-railway-models.outputs.synced == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          EXPECTED_BUNDLE_ID=$(jq -r .champion_bundle_id data/validation/model_decision.json)
          python -u scripts/import_recent_to_postgres.py \
            --full \
            --require-database \
            --expected-model-bundle-id "$EXPECTED_BUNDLE_ID"
