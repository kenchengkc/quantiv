name: P0 frontend release smoke

on:
  push:
    branches: [cleanup/p0-repository-hygiene]
    paths:
      - '.github/workflows/p0-frontend-release-smoke.yml'

permissions:
  contents: read

jobs:
  staging-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install verified rclone
        run: bash scripts/install_rclone.sh

      - name: Configure R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Publish to isolated staging prefix
        env:
          R2_REMOTE: r2:${{ secrets.R2_BUCKET || 'quantiv-data' }}/staging/p0-frontend-release
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/r2_push_frontend.sh

      - name: Materialize read-back release from staging
        env:
          R2_REMOTE: r2:${{ secrets.R2_BUCKET || 'quantiv-data' }}/staging/p0-frontend-release
        run: |
          set -euo pipefail
          rm -rf /tmp/frontend-release /tmp/frontend-public
          mkdir -p /tmp/frontend-release
          rclone copy "$R2_REMOTE/frontend" /tmp/frontend-release --fast-list
          python scripts/frontend_release.py verify --output-dir /tmp/frontend-release
          mkdir -p /tmp/frontend-public/brand
          printf 'source-controlled\n' > /tmp/frontend-public/brand/sentinel.txt
          python scripts/frontend_release.py materialize \
            --output-dir /tmp/frontend-release \
            --public-dir /tmp/frontend-public
          test -f /tmp/frontend-public/brand/sentinel.txt
          test -f /tmp/frontend-public/weekly.json
          test -d /tmp/frontend-public/symbols
