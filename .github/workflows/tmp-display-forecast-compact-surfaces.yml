name: Temporary display forecast compact-surface patch

on:
  push:
    branches:
      - feature/display-forecast-fallbacks

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply canonical display forecasts to compact surfaces') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/display-forecast-fallbacks
          fetch-depth: 1
      - name: Patch screener and watchlist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}\nOLD:\n{old}")
              path.write_text(text.replace(old, new, 1))

          watch = Path('apps/frontend/app/(authenticated)/watchlist/WatchlistPageClient.tsx')
          replace_once(
              watch,
              "import { companyName } from '@/lib/companyNames';\n",
              "import { companyName } from '@/lib/companyNames';\nimport {\n  displayForecastLabel,\n  finiteDisplayForecast,\n  type DisplayForecastFields,\n  type DisplayForecastMethod,\n} from '@/lib/displayForecast';\n",
          )
          replace_once(
              watch,
              """  expected_move?: {
    earnings_date?: string;
    straddle_pct: number | null;
    iv_pct: number | null;
    em_ml_pct?: number | null;
    em_ml_abs?: number | null;
    model_horizon?: number | null;
    ml_snapshot_date?: string | null;
    p10?: number | null;
    p25?: number | null;
    p50?: number | null;
    p75?: number | null;
    p90?: number | null;
    dte: number;
    timing?: string;
    lead_time_days?: number;
  };
""",
              """  expected_move?: DisplayForecastFields & {
    earnings_date?: string;
    straddle_pct?: number | null;
    iv_pct?: number | null;
    em_ml_pct?: number | null;
    em_ml_abs?: number | null;
    model_horizon?: number | null;
    ml_snapshot_date?: string | null;
    p10?: number | null;
    p25?: number | null;
    p50?: number | null;
    p75?: number | null;
    p90?: number | null;
    dte?: number | null;
    timing?: string;
    lead_time_days?: number;
  };
""",
          )
          replace_once(
              watch,
              """function liveMlLabel(
  liveState: WatchlistMlState | undefined,
  hasStaticMl: boolean,
  hasMathMove: boolean,
): string {
  if (liveState?.status === 'ready') {
    return liveState.response?.source === 'nightly_fallback'
      ? 'Snapshot ML'
      : 'Spot-updated ML';
  }
  if (hasStaticMl) return 'Snapshot ML';
  if (hasMathMove) return 'Straddle';
  return '';
}
""",
              """function watchlistForecastLabel(
  liveState: WatchlistMlState | undefined,
  staticMethod: DisplayForecastMethod | null | undefined,
): string {
  if (liveState?.status === 'ready' && liveState.response?.source !== 'nightly_fallback') {
    return 'Spot-updated ML';
  }
  return staticMethod ? displayForecastLabel(staticMethod) : '';
}
""",
          )
          replace_once(
              watch,
              """            const liveMlPct = emMatches && mlState?.status === 'ready' ? mlState.response?.em_ml_pct ?? null : null;
            const staticMlPct = emMatches ? em?.em_ml_pct ?? null : null;
            const mathMovePct = emMatches ? em?.straddle_pct ?? em?.iv_pct ?? null : null;
            const movePct = liveMlPct ?? staticMlPct ?? mathMovePct;
            const moveLabel = liveMlLabel(mlState, staticMlPct !== null, mathMovePct !== null);
""",
              """            // A genuine spot-updated model response may override the static
            // publication estimate. A nightly fallback is not a new model result,
            // so fall back to the one canonical display field from the payload.
            const liveMlPct =
              emMatches &&
              mlState?.status === 'ready' &&
              mlState.response?.source !== 'nightly_fallback'
                ? finiteDisplayForecast(mlState.response?.em_ml_pct)
                : null;
            const staticDisplayPct = emMatches
              ? finiteDisplayForecast(em?.display_forecast_pct)
              : null;
            const movePct = liveMlPct ?? staticDisplayPct;
            const moveLabel = liveMlPct != null
              ? 'Spot-updated ML'
              : watchlistForecastLabel(mlState, emMatches ? em?.display_forecast_method : null);
""",
          )

          screener = Path('apps/frontend/components/EarningsScreener.tsx')
          replace_once(
              screener,
              "import { companyName } from '@/lib/companyNames';\n",
              "import { companyName } from '@/lib/companyNames';\nimport { displayForecastLabel, type DisplayForecastFields } from '@/lib/displayForecast';\n",
          )
          replace_once(
              screener,
              "export interface ScreenerEvent {\n",
              "export interface ScreenerEvent extends DisplayForecastFields {\n",
          )
          replace_once(
              screener,
              """      } else if (preset === 'big_movers') {
        const m = ev.em_straddle_pct ?? 0;
        if (m < 0.10) return false;
""",
              """      } else if (preset === 'big_movers') {
        const m = ev.display_forecast_pct ?? 0;
        if (m < 0.10) return false;
""",
          )
          replace_once(
              screener,
              """        case 'straddle':
          return finite(ev.em_straddle_pct);
""",
              """        case 'straddle':
          return finite(ev.display_forecast_pct);
""",
          )
          replace_once(
              screener,
              "      if (e.em_straddle_pct != null && e.em_straddle_pct >= 0.10) big++;\n",
              "      if (e.display_forecast_pct != null && e.display_forecast_pct >= 0.10) big++;\n",
          )
          replace_once(
              screener,
              """  // Largest straddle EM in the visible set, used to scale the MoveBar so
  // the bar lengths read relative to the current view, not an absolute.
  const maxStraddle = useMemo(() => {
    return Math.max(0.04, ...sorted.map((e) => e.em_straddle_pct ?? 0));
  }, [sorted]);
""",
              """  // Largest canonical display forecast in the visible set, used to scale
  // the compact expected-move bar without changing analytical straddle fields.
  const maxDisplayForecast = useMemo(() => {
    return Math.max(0.04, ...sorted.map((e) => e.display_forecast_pct ?? 0));
  }, [sorted]);
""",
          )
          replace_once(
              screener,
              """              kicker: 'Straddle EM',
              label: 'Big movers',
              desc: 'Straddle pricing a ≥ 10% one-day move on print.',
""",
              """              kicker: 'Expected move',
              label: 'Big movers',
              desc: 'Canonical display estimate of at least 10% for the earnings print.',
""",
          )
          replace_once(
              screener,
              "{th('straddle', 'Straddle EM', 'One-day move priced by the print-expiry ATM straddle.')}\n",
              "{th('straddle', 'Expected move', 'Canonical display estimate: ML, strict or indicative options, or a historical fallback.')}\n",
          )
          replace_once(
              screener,
              """              <td style={{ padding: '16px 14px' }}>
                <MoveBar value={ev.em_straddle_pct} max={maxStraddle} />
              </td>
""",
              """              <td
                title={displayForecastLabel(ev.display_forecast_method)}
                style={{ padding: '16px 14px' }}
              >
                <MoveBar value={ev.display_forecast_pct} max={maxDisplayForecast} />
              </td>
""",
          )

          print('Patched canonical display forecasts into screener and watchlist.')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/frontend/components/EarningsScreener.tsx' \
                  'apps/frontend/app/(authenticated)/watchlist/WatchlistPageClient.tsx'
          git commit -m "Apply canonical display forecasts to compact surfaces"
          git push origin HEAD:feature/display-forecast-fallbacks
