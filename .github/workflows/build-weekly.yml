name: Build Weekly Earnings Data

# Manual-only: the data generator needs the full parquet dataset (~1 GB of
# options_chain files) which is not committed to git. Run locally with
#   python tools/build_frontend_data.py
# and commit the resulting public/weekly.json + public/symbols/*.json.
#
# This workflow exists so it can still be triggered when parquet data is
# staged in the runner (e.g. via a pre-step that downloads it from storage).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install duckdb==1.1.3 pandas pyarrow numpy

    - name: Check parquet data availability
      id: check_data
      run: |
        if ls data/parquet/options_chain/year=*/month=*/*.parquet >/dev/null 2>&1; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "::warning::Parquet options data not found — skipping rebuild."
        fi

    - name: Build weekly JSON
      if: steps.check_data.outputs.available == 'true'
      run: python tools/build_frontend_data.py

    - name: Commit and push changes
      if: steps.check_data.outputs.available == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/weekly.json public/symbols
        git diff --staged --quiet || git commit -m "Update weekly earnings data - $(date -u +%Y-%m-%d)"
        git push origin main

    - name: Deploy to Vercel (optional)
      if: steps.check_data.outputs.available == 'true' && env.VERCEL_DEPLOY_HOOK != ''
      run: curl -X POST "${{ env.VERCEL_DEPLOY_HOOK }}"
      env:
        VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
