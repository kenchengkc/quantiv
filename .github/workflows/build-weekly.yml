name: Build Weekly Earnings Data

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install duckdb==1.1.3 pandas pyarrow
    
    - name: Create public directory
      run: mkdir -p public
    
    - name: Build weekly JSON
      run: python tools/build_weekly_json.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/weekly.json
        git diff --staged --quiet || git commit -m "Update weekly earnings data - $(date -u +%Y-%m-%d)"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deploy to Vercel (optional)
      if: env.VERCEL_DEPLOY_HOOK
      run: |
        curl -X POST "${{ env.VERCEL_DEPLOY_HOOK }}"
      env:
        VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
