name: Refresh ticker names

# Pulls the SEC EDGAR ticker registries, normalizes casing, and commits
# the resulting `apps/frontend/public/ticker-names.json` and
# `ticker-exchanges.json` back to main. Vercel's git webhook picks up the
# commit and redeploys.
#
# Schedule:
#   06:00 UTC on the 1st of every 3rd month (Jan / Apr / Jul / Oct).
#   SEC updates the registry a few times per year, so quarterly is
#   plenty — it just adds new tickers and refreshes name casing.
#
# Manual trigger via workflow_dispatch for ad-hoc refreshes.
#
# Runtime: ~10 s (one HTTP fetch + JSON transform). No external services,
# no API keys, no R2 / DoltHub coupling.

on:
  schedule:
    - cron: '0 6 1 */3 *'
  workflow_dispatch:

concurrency:
  group: refresh-ticker-names
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Fetch + normalize SEC EDGAR ticker names
        run: node scripts/build_ticker_names.mjs

      - name: Sanity-check output is valid JSON with >5000 entries
        # Catches a SEC schema change or partial download before we
        # commit garbage. SEC has had ~10k entries for years; a sudden
        # drop below 5k means something's wrong.
        run: |
          node -e "
            const names = require('./apps/frontend/public/ticker-names.json');
            const exchanges = require('./apps/frontend/public/ticker-exchanges.json');
            const nameCount = Object.keys(names).length;
            const exchangeCount = Object.keys(exchanges).length;
            if (nameCount < 5000) { console.error('Only ' + nameCount + ' ticker names — aborting'); process.exit(1); }
            if (exchangeCount < 5000) { console.error('Only ' + exchangeCount + ' ticker exchanges — aborting'); process.exit(1); }
            console.log('OK: ' + nameCount + ' ticker names, ' + exchangeCount + ' ticker exchanges');
          "

      - name: Commit + push if changed
        run: |
          git config user.name 'quantiv-bot'
          git config user.email 'quantiv-bot@users.noreply.github.com'
          if git diff --quiet apps/frontend/public/ticker-names.json apps/frontend/public/ticker-exchanges.json; then
            echo "No changes — SEC registry matches current snapshot."
            exit 0
          fi
          git add apps/frontend/public/ticker-names.json apps/frontend/public/ticker-exchanges.json
          git commit -m "chore(data): refresh SEC EDGAR ticker names

          Auto-generated by .github/workflows/refresh-ticker-names.yml
          Sources: https://www.sec.gov/files/company_tickers.json
                   https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt
                   https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"
          git push
