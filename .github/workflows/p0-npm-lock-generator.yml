name: P0 npm security lock generator

on:
  push:
    branches: ["cleanup/p0-frontend-security-patches"]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: cleanup/p0-frontend-security-patches

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile within patched semver floors
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Verify security gates
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};
          const expected = {
            'node_modules/next': /^15\.5\.(2[5-9]|[3-9]\d)$/,
            'node_modules/sharp': /^0\.35\./,
            'node_modules/@clerk/nextjs': /^6\.39\.[6-9]$|^6\.(?:4\d|[5-9]\d)\./,
            'node_modules/@clerk/shared': /^3\.(?:4[8-9]|[5-9]\d)\./,
            'node_modules/js-cookie': /^3\.0\.[6-9]$|^3\.[1-9]\./,
            'node_modules/vitest': /^3\.2\.(?:[6-9]|\d{2,})$/,
            'node_modules/@vitest/ui': /^3\.2\.(?:[6-9]|\d{2,})$/,
          };
          for (const [path, pattern] of Object.entries(expected)) {
            const version = pkgs[path]?.version;
            if (!version || !pattern.test(version)) {
              throw new Error(`${path} resolved to ${version ?? 'missing'}, expected ${pattern}`);
            }
            console.log(`${path}: ${version}`);
          }
          NODE

      - name: Commit regenerated package lock
        run: |
          set -euo pipefail
          git config user.name 'quantiv-bot'
          git config user.email 'quantiv-bot@users.noreply.github.com'
          git add package-lock.json
          if git diff --staged --quiet; then
            echo 'package-lock.json already satisfies the patched dependency floors'
          else
            git commit -m 'P0: regenerate npm lock after security patches'
            git push origin HEAD:cleanup/p0-frontend-security-patches
          fi
