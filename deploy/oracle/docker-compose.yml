# Quantiv self-hosted stack for a single always-on VM (Oracle Cloud Always Free,
# or any Docker host). Replaces the two Railway services with the SAME image,
# pointing at the SAME external services (Neon Postgres, Upstash Redis, R2).
#
#   api    — FastAPI backend (was Railway service "quantiv")
#   worker — regular-hours quote worker (was Railway service "quantiv-quote-worker")
#   caddy  — TLS reverse proxy for api.usequantiv.com (Railway gave you TLS for free;
#            on your own VM, Caddy does it via Let's Encrypt, auto-renewing)
#
# Build context is the REPO ROOT (../..) because apps/backend/Dockerfile COPYs
# apps/ml, lib, and apps/frontend/public from there — identical to Railway.
#
# Secrets come from ./.env (gitignored; generated from Railway). See .env.example.

services:
  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: quantiv-backend:local
    env_file: ./.env
    environment:
      PORT: "8000"
      DATA_DIR: /data
      DUCKDB_PATH: /data/quantiv.duckdb
    volumes:
      - ./data:/data
    expose:
      - "8000"            # internal only; Caddy fronts it. No host port published.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s   # model sync from R2 + duckdb view build on first boot
    restart: unless-stopped

  worker:
    image: quantiv-backend:local
    depends_on:
      api:
        condition: service_started   # reuse the image api builds; don't rebuild
    command: ["python", "workers/quote_worker.py"]
    env_file: ./.env
    # The worker holds quote:regular:lease in Redis, so it is safe for this
    # worker and the old Railway worker to run at the same time during cutover —
    # only the lease holder writes quotes.
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: "${API_DOMAIN:-api.usequantiv.com}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@usequantiv.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists issued certs across restarts
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
